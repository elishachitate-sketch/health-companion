      <path d="M112 102v145c0 26 14 40 42 40h36" fill="none" stroke="#3F7770" stroke-width="28" stroke-linecap="round"/>
      <path d="M190 102v145c0 26 14 40 42 40h36" fill="none" stroke="#78A9A0" stroke-width="28" stroke-linecap="round"/>
      <circle cx="286" cy="94" r="15" fill="#F7F5F0"/>
      <text x="190" y="460" fill="#334155" font-size="28" font-weight="700">01 · SOFT TEAL</text>
    </g>
    <g transform="translate(560 50)">
      <rect width="380" height="380" rx="82" fill="#E9EDF6"/>
