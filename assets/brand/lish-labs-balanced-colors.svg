      <path d="M190 102v145c0 26 14 40 42 40h36" fill="none" stroke="#D39A87" stroke-width="28" stroke-linecap="round"/>
      <circle cx="286" cy="94" r="15" fill="#FFF9F5"/>
      <text x="190" y="460" fill="#334155" font-size="28" font-weight="700">03 · WARM CLAY</text>
