<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Lish Labs logo</title>
  <desc id="desc">A charcoal rounded-square mark with a connected LL monogram in electric blue and violet, followed by the Lish Labs wordmark.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" fill="#FFFFFF"/>
  <g transform="translate(30 30)">
    <rect width="240" height="240" rx="58" fill="#171717"/>
    <path d="M74 62v102c0 18 10 28 29 28h25" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M128 62v102c0 18 10 28 29 28h25" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="180" cy="58" r="10" fill="#A78BFA"/>
  </g>
  <g fill="#171717" font-family="Arial, Helvetica, sans-serif">
    <text x="320" y="145" font-size="76" font-weight="700" letter-spacing="-2">Lish</text>
    <text x="320" y="212" font-size="58" font-weight="400" letter-spacing="7">LABS</text>
  </g>
  <text x="324" y="255" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="1.2">BUILDING INTELLIGENT DIGITAL EXPERIENCES</text>
</svg>
