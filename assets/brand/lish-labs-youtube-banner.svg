<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" role="img" aria-labelledby="title desc">
  <title id="title">Lish Labs YouTube banner</title>
  <desc id="desc">A dark technology brand banner for Lish Labs with a connected LL mark and tagline.</desc>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#312E81" stop-opacity=".55"/>
      <stop offset="1" stop-color="#171717" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="2560" height="1440" fill="#111111"/>
  <circle cx="1950" cy="720" r="720" fill="url(#halo)"/>
  <g transform="translate(430 440) scale(2.35)">
    <rect width="240" height="240" rx="58" fill="#242424" stroke="#3B82F6" stroke-opacity=".32" stroke-width="3"/>
    <path d="M74 62v102c0 18 10 28 29 28h25" fill="none" stroke="url(#glow)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M128 62v102c0 18 10 28 29 28h25" fill="none" stroke="url(#glow)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="180" cy="58" r="10" fill="#A78BFA"/>
  </g>
  <text x="1100" y="690" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="190" font-weight="700" letter-spacing="-5">Lish</text>
  <text x="1110" y="850" fill="#C4B5FD" font-family="Arial, Helvetica, sans-serif" font-size="115" letter-spacing="28">LABS</text>
  <text x="1115" y="965" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="42" letter-spacing="4">BUILDING INTELLIGENT DIGITAL EXPERIENCES</text>
</svg>
