name: health_companion
description: A mobile-first AI wellbeing companion for the Future Health challenge.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_functions: ^5.1.4
  http: ^1.2.2
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.3.3
  record: ^7.1.2
  web_socket_channel: ^3.0.3
  audio_stream_player: ^1.1.0
  sqflite_sqlcipher: ^3.1.0
  flutter_secure_storage: ^9.2.2
  fl_chart: ^1.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/reference-flow.jpg
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
